<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WealthTracker - Track Your Net Worth</title>
    <meta name="description" content="Track your wealth across multiple currencies and categories. Visualize your financial growth over time." />
    <meta name="author" content="hwendev" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#3366CC" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="WealthTracker" />
    <meta property="og:description" content="Track your wealth across multiple currencies and categories. Visualize your financial growth over time." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wealth.hwendev.com" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="WealthTracker" />
    <meta name="twitter:description" content="Track your wealth across multiple currencies and categories." />
  </head>

  <body>
    <script>
      // Apply theme before React renders to prevent flash
      (function() {
        var t = localStorage.getItem('wealth_theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
